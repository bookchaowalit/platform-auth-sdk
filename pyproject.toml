[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-service-auth"
version = "0.1.0"
description = "Owner-scoped JWT verification for Solo Empire metadata services"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.10.1,<3"]

[tool.setuptools]
packages = ["service_auth"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "mypy>=1.13", "ruff>=0.8"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["service_auth", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.ruff]
target-version = "py311"

[tool.coverage.run]
source = ["service_auth"]
